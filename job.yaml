apiVersion: batch/v1
kind: Job
metadata:
  name: tf-check
  namespace: dev
spec:
  template:
    spec:
      containers:
        - name: tf-validate
          image: hashicorp/terraform:latest
          command: ["sh", "-c", "terraform version && echo 'Validation logic goes here'"]
      restartPolicy: Never
  backoffLimit: 2
