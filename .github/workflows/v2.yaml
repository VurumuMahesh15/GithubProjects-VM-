name: Version2
on:
    workflow_dispatch:
permissions:
    contents: read
jobs:
    bash:
        runs-on: ubuntu-latest
        steps:
            - name: bash
              run: |
                    echo "::group::Bash"
                    {
                        echo "----------------------"
                        echo "This is Bash"
                        echo "Date: $(date)"
                        echo "Time: $(date +%T)"
                        echo "User: $(whoami)"
                        echo "Current Directory: $(pwd)"
                        echo "Files in Current Directory: $(ls)"
                        echo "Current Process: $(ps)"
                        echo "Thank you for using our service!"
                        echo "----------------------"
                    } > report.txt
                    echo "::endgroup::"
            - name: upload report
              uses: actions/upload-artifact@v4
              with:
                    name: report
                    path: report.txt
    version:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.ver.outputs.Version }}
        steps:
            - name: version
              id: ver
              run: |
                    echo "Version=$(date +%Y.%m.%d.%H.%M.%S)" >> $GITHUB_OUTPUT
            - name: print version
              run: |
                    echo "::add-mask::${{ steps.ver.outputs.Version }}"
                    echo "Version: ${{ steps.ver.outputs.Version }}"
    artifacts:
        runs-on: ubuntu-latest
        needs:
            - bash
            - version
        steps:
            - name: download report
              uses: actions/download-artifact@v4
              with:
                    name: report
            - name: upload artifacts
              uses: actions/upload-artifact@v4
              with:
                    name: report-VM-${{ needs.version.outputs.version }}
                    path: report.txt
            - name: Notification
              run: |
                    echo "::notice:: Artifact generation and Name Wire completed"
                    