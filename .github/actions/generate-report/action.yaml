name: 'Generate Deployment Report'
description: 'Generates a deployment report for a given environment and uploads it as an artifact'

inputs:
  env-label:
    description: 'Name of the environment this report is for (dev, staging, or prod)'
    required: true
  version:
    description: 'Version/timestamp string generated by the version job'
    required: true
runs:
  using: "composite"
  steps:
    - shell: bash
      run: |
        # Map short env names to human-readable label + description
        case "${{ inputs.env-label }}" in
          dev)
            ENV_DISPLAY="Development"
            ENV_DESCRIPTION="This deployment was automatically validated in the development environment."
            ;;
          staging)
            ENV_DISPLAY="Staging"
            ENV_DESCRIPTION="This deployment was automatically validated in staging, ahead of production release."
            ;;
          prod)
            ENV_DISPLAY="Production"
            ENV_DESCRIPTION="This deployment was automatically validated and released with zero manual intervention."
            ;;
          *)
            ENV_DISPLAY="${{ inputs.env-label }}"
            ENV_DESCRIPTION="This deployment was automatically validated."
            ;;
        esac

        {
          echo "================================"
          echo "DEPLOYMENT SUMMARY"
          echo "================================"
          echo "Status:        SUCCESS"
          echo "Environment:   $ENV_DISPLAY"
          echo "Description:   $ENV_DESCRIPTION"
          echo "--------------------------------"
          echo "RELEASE DETAILS"
          echo "--------------------------------"
          echo "Version:        ${{ inputs.version }}"
          echo "Released by:    ${{ github.actor }}"
          echo "Source commit:  ${{ github.sha }}"
          echo "Branch:         ${{ github.ref_name }}"
          echo "Timestamp:      $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "--------------------------------"
          echo "VALIDATION"
          echo "--------------------------------"
          echo "Infrastructure validated:  PASS (Terraform)"
          echo "Report generated:          PASS"
          echo "================================"
        } > report-${{ inputs.env-label }}.txt

    - name: Upload report artifact
      uses: actions/upload-artifact@v4
      with:
        name: report-${{ inputs.env-label }}
        path: report-${{ inputs.env-label }}.txt